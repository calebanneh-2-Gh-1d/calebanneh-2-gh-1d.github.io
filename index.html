<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scout Escort - Live Football & Talent Hub</title>
  <style>
    :root {
      --primary: #0a192f;
      --accent: #00ff88;
      --light: #f4f4f9;
      --dark: #1e1e24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--light); color: var(--dark); line-height: 1.6; }
    header { background: var(--primary); color: #fff; padding: 1rem 5%; text-align: center; border-bottom: 3px solid var(--accent); }
    header h1 { font-size: 2rem; }
    header span { color: var(--accent); }
    nav { display: flex; justify-content: center; background: #112240; padding: 0.5rem; gap: 10px; }
    nav button { background: transparent; border: none; color: #fff; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 5px; }
    nav button.active { background: var(--accent); color: var(--primary); }
    .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .match-item { border: 1px solid #e0e0e0; padding: 15px; margin-bottom: 12px; border-radius: 8px; background: #fafafa; }
    .match-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: #666; margin-bottom: 8px; }
    .match-scores { display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; font-weight: bold; }
    .match-status { text-align: center; color: green; font-weight: bold; font-size: 0.85rem; margin-top: 8px; }
    form label { display: block; margin-top: 10px; font-weight: bold; }
    form input, form select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; }
    form button { background: var(--primary); color: #fff; border: none; padding: 12px 20px; margin-top: 15px; width: 100%; font-weight: bold; border-radius: 5px; cursor: pointer; }
    form button:hover { background: var(--accent); color: var(--primary); }
  </style>
</head>
<body>

  <header>
    <h1>Scout <span>Escort</span></h1>
    <p>Live Scores, Football Talent Network & Streaming Hub</p>
  </header>

  <nav>
    <button class="nav-btn active" onclick="switchTab('matches')">Live Matches</button>
    <button class="nav-btn" onclick="switchTab('register')">Player Registration</button>
  </nav>

  <div class="container">
    
    <!-- Tab 1: Live Matches -->
    <div id="matches" class="tab-content active">
      <div class="card">
        <h2>Live & Scheduled Matches</h2>
        <p style="color: #666; font-size: 0.9rem; margin-bottom: 15px;">Powered by API-Football Data</p>
        <div id="live-matches-container">
          <p>Loading scores...</p>
        </div>
      </div>
    </div>

    <!-- Tab 2: Player Registration -->
    <div id="register" class="tab-content">
      <div class="card">
        <h2>Register as Player or Scout</h2>
        <form id="signup-form">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" required placeholder="e.g. John Doe">

          <label for="role">Role</label>
          <select id="role">
            <option value="player">Footballer / Player</option>
            <option value="scout">Scout / Agent</option>
          </select>

          <label for="position">Preferred Position (if Player)</label>
          <input type="text" id="position" placeholder="e.g. Midfielder, Striker">

          <label for="email">Contact Email</label>
          <input type="email" id="email" required placeholder="name@example.com">

          <button type="button" onclick="handleFormSubmit()">Submit Profile</button>
        </form>
        <div id="form-msg" style="margin-top: 10px; font-weight: bold; text-align: center;"></div>
      </div>
    </div>

  </div>

  <script>
    // Tab Switcher Logic
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    // API-Football Integration
    const apiKey = "39f724ce55c7bafb8923fbe0da903827";

    async function loadLiveScores() {
      const container = document.getElementById("live-matches-container");
      
      try {
        let response = await fetch("https://v3.football.api-sports.io/fixtures?live=all", {
          method: "GET",
          headers: { "x-apisports-key": apiKey }
        });
        let data = await response.json();
        let matches = data.response;

        if (!matches || matches.length === 0) {
          const today = new Date().toISOString().split("T")[0];
          response = await fetch(`https://v3.football.api-sports.io/fixtures?date=${today}`, {
            method: "GET",
            headers: { "x-apisports-key": apiKey }
          });
          data = await response.json();
          matches = data.response;
        }

        if (!matches || matches.length === 0) {
          container.innerHTML = "<p>No matches available right now.</p>";
          return;
        }

        container.innerHTML = matches.slice(0, 10).map(match => `
          <div class="match-item">
            <div class="match-header">
              <span>${match.league.name} (${match.league.country})</span>
              <span>${match.fixture.status.short}</span>
            </div>
            <div class="match-scores">
              <span>${match.teams.home.name}</span>
              <span>${match.goals.home ?? 0} - ${match.goals.away ?? 0}</span>
              <span>${match.teams.away.name}</span>
            </div>
            <div class="match-status">
              ${match.fixture.status.long} ${match.fixture.status.elapsed ? "(" + match.fixture.status.elapsed + "')" : ""}
            </div>
          </div>
        `).join("");

      } catch (error) {
        console.error("API Error:", error);
        container.innerHTML = "<p>Unable to connect to live match servers right now.</p>";
      }
    }

    // Registration Handler Demo
    function handleFormSubmit() {
      const name = document.getElementById('fullname').value;
      const msg = document.getElementById('form-msg');
      if (name) {
        msg.style.color = "green";
        msg.innerText = `Thank you, ${name}! Your profile submission was recorded.`;
        document.getElementById('signup-form').reset();
      } else {
        msg.style.color = "red";
        msg.innerText = "Please fill in all required fields.";
      }
    }

    // Initialize scores on load
    loadLiveScores();
  </script>
</body>
</html>

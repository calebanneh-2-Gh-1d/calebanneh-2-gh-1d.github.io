<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scout Escort - Dynamic Football Network</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; }
        
        header { background: #161b22; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #238636; flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #ffffff; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .logo span { color: #238636; }
        
        .container { max-width: 1300px; margin: 25px auto; padding: 0 20px; display: grid; grid-template-columns: 280px 1fr 300px; gap: 20px; }
        
        .card-panel { background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d; height: fit-content; margin-bottom: 20px; }
        .card-panel h3 { color: #fff; margin-bottom: 15px; border-bottom: 1px solid #30363d; padding-bottom: 8px; font-size: 1rem; }
        
        /* Form Inputs */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.8rem; color: #8b949e; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 8px 10px; border: 1px solid #30363d; background: #0d1117; color: #fff; border-radius: 6px; outline: none; }
        .btn { width: 100%; padding: 10px; background: #238636; border: none; color: white; cursor: pointer; border-radius: 6px; font-weight: bold; margin-top: 5px; }
        .btn:hover { background: #2ea043; }

        /* Directory Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }
        .profile-card { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 15px; text-align: left; }
        .profile-card h4 { color: #ffffff; font-size: 1.1rem; }
        .badge { display: inline-block; padding: 2px 8px; background: #21262d; border: 1px solid #30363d; border-radius: 12px; color: #238636; font-size: 0.75rem; margin-top: 5px; }
        
        footer { text-align: center; padding: 20px; margin-top: 40px; background: #161b22; color: #8b949e; border-top: 1px solid #30363d; font-size: 0.8rem; }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">SCOUT<span>ESCORT</span> 🌐 NETWORK</a>
    </header>

    <div class="container">
        <!-- Registration Sidebar -->
        <div>
            <div class="card-panel">
                <h3>📝 Register Profile</h3>
                <form id="profileForm">
                    <div class="form-group">
                        <label>Full Name / Club Name</label>
                        <input type="text" id="nameInput" placeholder="e.g. John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <select id="roleInput">
                            <option value="Player">Player</option>
                            <option value="Scout">Scout</option>
                            <option value="Club / Academy">Club / Academy</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Primary Position / Detail</label>
                        <input type="text" id="detailInput" placeholder="e.g. Midfielder / Ghana" required>
                    </div>
                    <button type="submit" class="btn">Add to Live Network</button>
                </form>
            </div>
        </div>

        <!-- Dynamic Main Content -->
        <div>
            <div class="card-panel">
                <h3>🌐 Live Registered Directory</h3>
                <div id="directoryGrid" class="grid">
                    <p style="color: #8b949e; font-size: 0.85rem;">Connecting to database...</p>
                </div>
            </div>
        </div>

        <!-- Match Panel -->
        <div>
            <div class="card-panel">
                <h3>⚽ Platform Notice</h3>
                <p style="font-size: 0.85rem; color: #8b949e; line-height: 1.4;">
                    Profiles added on this page save directly to Cloud Firestore in real time.
                </p>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Scout Escort Platform.</p>
    </footer>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD__xh7FZIoes8WuVlaW-...",
            authDomain: "scout-escort.firebaseapp.com",
            projectId: "scout-escort",
            storageBucket: "scout-escort.firebasestorage.app",
            messagingSenderId: "920239833217",
            appId: "1:920239833217:web:848948a32...",
            measurementId: "G-9DMZLL3XQE"
        };

        // Initialize Firebase & Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const profilesRef = collection(db, "profiles");

        // Save new profile to Firestore
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('nameInput').value;
            const role = document.getElementById('roleInput').value;
            const detail = document.getElementById('detailInput').value;

            try {
                await addDoc(profilesRef, {
                    name: name,
                    role: role,
                    detail: detail,
                    createdAt: new Date()
                });
                document.getElementById('profileForm').reset();
            } catch (err) {
                alert("Error saving profile: " + err.message);
            }
        });

        // Listen for live database changes and display profiles automatically
        onSnapshot(query(profilesRef, orderBy("createdAt", "desc")), (snapshot) => {
            const grid = document.getElementById('directoryGrid');
            grid.innerHTML = '';
            
            if (snapshot.empty) {
                grid.innerHTML = '<p style="color: #8b949e; font-size: 0.85rem;">No profiles created yet. Use the form to submit one!</p>';
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                grid.innerHTML += `
                    <div class="profile-card">
                        <h4>${data.name}</h4>
                        <span class="badge">${data.role}</span>
                        <p style="font-size: 0.85rem; color: #8b949e; margin-top: 8px;">${data.detail}</p>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>

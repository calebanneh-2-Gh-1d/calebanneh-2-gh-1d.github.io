<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scout Escort</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    nav {
      background-color: #222;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }
    .nav-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 16px;
      padding: 8px 16px;
      cursor: pointer;
    }
    .nav-btn.active {
      border-bottom: 3px solid #007bff;
      font-weight: bold;
    }
    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 15px;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .news-card {
      background-color: #f9f9f9;
      border-left: 4px solid #007bff;
      padding: 12px 16px;
      margin-bottom: 15px;
      border-radius: 4px;
    }
    .news-card h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
    }
    .news-card p {
      color: #444;
      font-size: 14px;
      margin: 0 0 8px 0;
    }
    form input, form button {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      padding: 10px;
      box-sizing: border-box;
    }
    form button {
      background-color: #007bff;
      color: #fff;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <nav>
    <button class="nav-btn active" onclick="switchTab(event, 'matches')">Live Matches</button>
    <button class="nav-btn" onclick="switchTab(event, 'news')">Football News</button>
    <button class="nav-btn" onclick="switchTab(event, 'standings')">Rankings</button>
    <button class="nav-btn" onclick="switchTab(event, 'register')">Registration</button>
  </nav>

  <div class="container">
    
    <!-- Tab 1: Live Matches -->
    <div id="matches" class="tab-content active">
      <div class="card">
        <h2>Live & Scheduled Matches</h2>
        <div id="live-matches-container">
          <p>Loading scores...</p>
        </div>
      </div>
    </div>

    <!-- Tab 2: Football News & Transfers -->
    <div id="news" class="tab-content">
      <div class="card">
        <h2>Latest Football News & Transfers</h2>
        <div id="rss-news-container">
          <p>Loading latest football headlines...</p>
        </div>
      </div>
    </div>

    <!-- Tab 3: Rankings & Standings -->
    <div id="standings" class="tab-content">
      <div class="card">
        <h2>FIFA World Rankings</h2>
        <p>Rankings update periodically during match cycles.</p>
      </div>
    </div>

    <!-- Tab 4: Player Registration -->
    <div id="register" class="tab-content">
      <div class="card">
        <h2>Talent Registration</h2>
        <form id="signup-form" onsubmit="event.preventDefault(); handleFormSubmit();">
          <input type="text" id="fullname" placeholder="Full Name" required>
          <button type="submit">Submit Registration</button>
        </form>
        <p id="form-msg"></p>
      </div>
    </div>

  </div>

  <script>
    const apiKey = "";

    async function loadLiveScores() {
      const container = document.getElementById("live-matches-container");
      try {
        let response = await fetch("https://v3.football.api-sports.io/fixtures?live=all", {
          method: "GET",
          headers: { "x-apisports-key": apiKey }
        });
        let data = await response.json();
        let matches = data.response;

        if (!matches || matches.length === 0) {
          const today = new Date().toISOString().split("T")[0];
          response = await fetch(`https://v3.football.api-sports.io/fixtures?date=${today}`, {
            method: "GET",
            headers: { "x-apisports-key": apiKey }
          });
          data = await response.json();
          matches = data.response;
        }

        if (!matches || matches.length === 0) {
          container.innerHTML = "<p>No matches available right now.</p>";
          return;
        }

        container.innerHTML = matches.slice(0, 10).map(match => {
          const streamQuery = encodeURIComponent(`${match.teams.home.name} vs ${match.teams.away.name} live stream`);
          const streamUrl = `https://www.youtube.com/results?search_query=${streamQuery}`;
          return `
            <div class="match-item">
              <div><span>${match.league.name} (${match.league.country})</span> - <span>${match.fixture.status.short}</span></div>
              <div><span>${match.teams.home.name}</span> <span>${match.goals.home ?? 0} - ${match.goals.away ?? 0}</span> <span>${match.teams.away.name}</span></div>
              <a href="${streamUrl}" target="_blank">Search Live Stream on YouTube</a>
            </div>
          `;
        }).join('');
      } catch (error) {
        container.innerHTML = "<p>Unable to connect to live match servers right now.</p>";
      }
    }

    function fetchFootballNews() {
      const feedUrl = "https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Ffeeds.bbci.co.uk%2Fsport%2Ffootball%2Frss.xml";
      const container = document.getElementById("rss-news-container");

      fetch(feedUrl)
        .then(response => response.json())
        .then(data => {
          if (data.status === "ok" && data.items.length > 0) {
            let html = "";
            data.items.slice(0, 5).forEach(article => {
              html += `
                <article class="news-card">
                  <h3><a href="${article.link}" target="_blank" style="text-decoration:none; color:#007bff;">${article.title}</a></h3>
                  <p>${article.description}</p>
                  <small style="color:#888;">Published: ${new Date(article.pubDate).toLocaleDateString()}</small>
                </article>
              `;
            });
            container.innerHTML = html;
          } else {
            container.innerHTML = "<p>Unable to load news right now.</p>";
          }
        })
        .catch(() => {
          container.innerHTML = "<p>Error loading live football news.</p>";
        });
    }

    function handleFormSubmit() {
      const name = document.getElementById('fullname').value;
      const msg = document.getElementById('form-msg');
      if (name) {
        msg.style.color = "green";
        msg.innerText = `Thank you, ${name}! Your profile submission was recorded.`;
        document.getElementById('signup-form').reset();
      } else {
        msg.style.color = "red";
        msg.innerText = "Please fill in all required fields.";
      }
    }

    function switchTab(event, tabId) {
      const contents = document.querySelectorAll('.tab-content');
      contents.forEach(content => content.classList.remove('active'));

      const buttons = document.querySelectorAll('.nav-btn');
      buttons.forEach(btn => btn.classList.remove('active'));

      const selectedTab = document.getElementById(tabId);
      if (selectedTab) selectedTab.classList.add('active');
      if (event && event.currentTarget) event.currentTarget.classList.add('active');
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadLiveScores();
      fetchFootballNews();
    });
  </script>
</body>
</html>

  <style>
    :root {
      --bg-color: #0d2818;
      --card-bg: #ffffff;
      --text-dark: #111111;
      --accent-red: #cc0000;
      --primary-green: #044b23;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
    }

    /* Seamless Infinite Moving Sponsor Ticker */
    .sponsor-ticker {
      background-color: #000000;
      overflow: hidden;
      white-space: nowrap;
      padding: 10px 0;
      border-bottom: 2px solid #1b432a;
      display: flex;
      width: 100%;
    }

    .ticker-track {
      display: flex;
      width: max-content;
      animation: infiniteMarquee 25s linear infinite;
    }

    .sponsor-ticker:hover .ticker-track {
      animation-play-state: paused;
    }

    .brand-group {
      display: flex;
      align-items: center;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-right: 25px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.8px;
      padding: 6px 14px;
      border-radius: 4px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand-badge svg {
      flex-shrink: 0;
    }

    /* Official Brand Badge Colors & Styling */
    .brand-qatar { color: #ffffff; background: #58111A; border: 1px solid #701722; }
    .brand-nike { color: #ffffff; background: #111111; border: 1px solid #333333; }
    .brand-puma { color: #ffffff; background: #000000; border: 1px solid #333333; }
    .brand-adidas { color: #ffffff; background: #000000; border: 1px solid #333333; }
    .brand-mercedes { color: #ffffff; background: #000000; border: 1px solid #444444; }
    .brand-mastercard { color: #ffffff; background: #111111; border: 1px solid #333333; }

    @keyframes infiniteMarquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Header Nav */
    header {
      background-color: #111111;
      color: #ffffff;
      padding: 12px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header button {
      background: none;
      border: none;
      color: #cccccc;
      font-weight: 600;
      font-size: 14px;
      padding: 8px 12px;
      cursor: pointer;
    }

    header button.active {
      color: #ffffff;
      border-bottom: 2px solid #25d366;
    }

    /* Main Container */
    .container {
      max-width: 500px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    h2 {
      margin-top: 0;
      color: var(--primary-green);
    }

    /* Player & Match Cards */
    .player-card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .player-info h4 {
      margin: 0 0 4px 0;
    }

    .player-info p {
      margin: 2px 0;
      font-size: 13px;
      color: #555555;
    }

    .btn-action {
      background-color: var(--accent-red);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
      display: inline-block;
    }

    /* Registration Form Styling */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .submit-btn {
      width: 100%;
      background-color: var(--primary-green);
      color: white;
      border: none;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
  </style>
</head>
